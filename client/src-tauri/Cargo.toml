[package]
name = "hazel-client"
version = "0.1.0"
description = "Hazel desktop client"
authors = ["Hazel"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "hazel_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
