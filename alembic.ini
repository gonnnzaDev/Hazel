[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# La URL real se resuelve en migrations/env.py desde la config de la app,
# para no duplicar credenciales acá.
sqlalchemy.url =

[post_write_hooks]
# `ruff` es un binario de Rust y no expone un entrypoint de consola, así que
# no se puede usar `type = console_scripts`. Se ejecuta vía `uv run`.
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = uv
ruff_format.options = run ruff format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S