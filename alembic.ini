[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# The real URL is resolved in migrations/env.py from the app config,
# so credentials are not duplicated here.
sqlalchemy.url =

[post_write_hooks]
# `ruff` is a Rust binary and exposes no console entrypoint, so
# `type = console_scripts` cannot be used. It runs via `uv run`.
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = uv
ruff_format.options = run ruff format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S