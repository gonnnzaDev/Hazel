[project]
name = "recop"
version = "0.1.0"
description = "Chat autoservido. Tu servidor, tu máquina, tu puerto."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "UNLICENSED" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",  # driver síncrono, solo para las migraciones
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "aiokafka>=0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "core"]

# ──────────────────────────────────────────────────────────────────────────────
# entrypoints
# ──────────────────────────────────────────────────────────────────────────────
[project.scripts]
recop-api = "core.cli:run"

# ──────────────────────────────────────────────────────────────────────────────
# pytest
# ──────────────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error", "ignore::DeprecationWarning"]

# ──────────────────────────────────────────────────────────────────────────────
# ruff
# ──────────────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["apps", "core", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "ASYNC",
    "S",    # bandit
    "B",    # bugbear
    "C4",   # comprehensions
    "DTZ",  # datetime tz
    "T20",  # print
    "SIM",  # simplify
    "RUF",
]
ignore = [
    "S101",  # assert: se usa en tests
    "B008",  # Depends() en defaults es la convención de FastAPI
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20"]
"migrations/**" = ["E501"]
# Son CLIs: escriben su progreso en stdout para que el operador lo vea.
# `logging` acá sumaría configuración sin aportar nada.
"core/wait_for_db.py" = ["T201"]
"core/cli.py" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "core"]

# ──────────────────────────────────────────────────────────────────────────────
# mypy
# ──────────────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "."
warn_unreachable = true
show_error_codes = true
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["aiokafka.*", "asyncpg.*"]
ignore_missing_imports = true