[project]
name = "hazel-composer"
version = "0.1.0"
description = "Hazel: orquestación en Python puro. El servidor está en Rust."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "UNLICENSED" }
# El composer usa únicamente la biblioteca estándar: sin dependencias.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["composer"]

# Opcional: `hazel-composer ...` en vez de `python -m composer ...`.
[project.scripts]
hazel-composer = "composer.__main__:main"
