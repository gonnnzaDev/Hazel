# Recop — stack completo.
#
# `docker compose up` levanta todo: el nodo, PostgreSQL y Kafka.
#
# La idea es que cualquiera que clone esto tenga **exactamente el mismo
# entorno**, sin instalar Python ni PostgreSQL a mano. Para desarrollar sobre
# el código hay un compose más liviano en docker-compose.dev.yml, que solo
# levanta las dependencias y deja la API corriendo en la máquina.

x-recop-image: &recop-image
  build:
    context: .
    dockerfile: Dockerfile
  image: gonnnzadev/recop:0.1.0

services:
  # ─── El nodo ───────────────────────────────────────────────────────────────
  #
  # Publica en 0.0.0.0 a propósito: es lo que hace falta para que alguien en la
  # misma red se conecte. Para probar solo desde tu máquina, `localhost:7272`
  # alcanza.
  api:
    <<: *recop-image
    container_name: recop-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "${RECOP_PUBLISH_HOST:-0.0.0.0}:${RECOP_PUBLISH_PORT:-7272}:7272"
    environment:
      RECOP_ENV: prod
      RECOP_SECRET_KEY: ${RECOP_SECRET_KEY:?definí RECOP_SECRET_KEY en tu .env}
      RECOP_HOST: 0.0.0.0
      RECOP_PORT: 7272
      RECOP_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-recop}:${POSTGRES_PASSWORD:-recop}@postgres:5432/${POSTGRES_DB:-recop}
      RECOP_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      RECOP_AUTO_MIGRATE: "true"
    # Sin healthcheck propio: el HEALTHCHECK del Dockerfile ya lo define, y
    # docker compose reutiliza el de la imagen.

  # ─── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    container_name: recop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recop}
      POSTGRES_DB: ${POSTGRES_DB:-recop}
    ports:
      # Publicado solo para poder entrar con psql. En una máquina compartida,
      # cambialo a "127.0.0.1:${POSTGRES_PORT:-5432}:5432".
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recop} -d ${POSTGRES_DB:-recop}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Kafka ─────────────────────────────────────────────────────────────────
  #
  # Imagen oficial de Apache (no la de Bitnami: las versiones viejas de Bitnami
  # ya no se pueden descargar). Modo KRaft, sin ZooKeeper.
  #
  # Dos listeners: `PLAINTEXT_HOST` para entrar desde la máquina, `PLAINTEXT`
  # para entrar desde la red de Docker. Por eso el nodo usa `kafka:19092` y no
  # `localhost:9092`.
  kafka:
    image: apache/kafka:3.9.1@sha256:4ceccc577f03f51f6af8dbfda55194d0d892f4fa7913ffbded567ce3895622ed
    container_name: recop-kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9092}:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,PLAINTEXT_HOST://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data

volumes:
  postgres_data:
  kafka_data: